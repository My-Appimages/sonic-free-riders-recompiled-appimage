
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'v1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse2 \
            libsdl2-2.0-0

      - name: Download and Setup LinuxDeploy
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod a+x linuxdeploy-x86_64.AppImage
          sudo mv linuxdeploy-x86_64.AppImage /usr/local/bin/linuxdeploy

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Make script executable
        run: chmod +x ./build-appimage-ubuntu.sh

      - name: Execute Bash script
        run: ./build-appimage-ubuntu.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: zakuro-appimage
          path: Sonic-Free-Riders-Recompiled-x86_64.AppImage.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: zakuro-appimage

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Release ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: Sonic-Free-Riders-Recompiled-x86_64.AppImage
